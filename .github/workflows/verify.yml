name: verify-meetwise-public-origin
run-name: meetwise-public-origin-${{ inputs.probe_nonce }}

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Exact public Tailscale origin to probe
        required: true
        type: string
      probe_nonce:
        description: One-time 64-hex nonce issued by the ECS controller
        required: true
        type: string
      expected_manifest_sha256:
        description: Expected canonical SHA-256 identity of the public manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: preview-verifier
    steps:
      - name: Checkout the fixed verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the pinned verifier runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install the locked browser verifier
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run verifier behavior proof before browser E2E
        run: node scripts/verify-preview-e2e.proof.mjs

      - name: Install the pinned Chromium runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Independent HTTPS probe
        id: probe
        shell: bash
        env:
          REQUESTED_ORIGIN: ${{ inputs.origin }}
          PROBE_NONCE: ${{ inputs.probe_nonce }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          MANIFEST_PUBLIC_KEY: ${{ secrets.MANIFEST_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const { createHash, createPublicKey, verify } = require('node:crypto');
          const canonical = v => Array.isArray(v) ? `[${v.map(canonical).join(',')}]` : v && typeof v === 'object' ? `{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${canonical(v[k])}`).join(',')}}` : JSON.stringify(v);
          const sha = v => createHash('sha256').update(v).digest('hex');
          const origin = process.env.REQUESTED_ORIGIN;
          const nonce = process.env.PROBE_NONCE;
          const expectedManifestSha256 = process.env.EXPECTED_MANIFEST_SHA256;
          if (origin !== process.env.ALLOWED_ORIGIN || !/^https:\/\/[a-z0-9-]+\.tail[a-z0-9]+\.ts\.net$/.test(origin) || !/^[a-f0-9]{64}$/.test(nonce) || !/^[a-f0-9]{64}$/.test(expectedManifestSha256)) throw new Error('probe_input_rejected');
          const bounded = async path => {
            const url = `${origin}${path}`;
            const r = await fetch(url, { method:'GET', redirect:'error', cache:'no-store', headers:{accept:'text/html,application/json'}, signal:AbortSignal.timeout(20000) });
            if (r.status !== 200 || r.url !== url || !r.body) throw new Error('probe_surface_invalid');
            const reader = r.body.getReader(); const chunks=[]; let bytes=0;
            for (;;) { const {done,value}=await reader.read(); if(done) break; bytes+=value.byteLength; if(bytes>2000000){await reader.cancel();throw new Error('probe_surface_too_large')} chunks.push(value); }
            return Buffer.concat(chunks).toString('utf8');
          };
          (async()=>{
            const [root,login,manifestText] = await Promise.all([bounded('/'),bounded('/login'),bounded('/preview-release-manifest.json')]);
            const manifest=JSON.parse(manifestText); const {signature,...unsigned}=manifest;
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(signature ?? '') || manifest.schemaVersion !== 1 || manifest.signingKeyId !== 'ecs-preview-ed25519-v1') throw new Error('manifest_shape_invalid');
            if (!verify(null,Buffer.from(canonical(unsigned)),createPublicKey(process.env.MANIFEST_PUBLIC_KEY),Buffer.from(signature,'base64'))) throw new Error('manifest_signature_invalid');
            const requiredReceipts = ['runtime','synthetic','database','edge','blackbox'];
            if (manifest.status!=='verified'||manifest.revoked!==false||manifest.mode!=='public-full-stack-probe'||manifest.origin!==origin || !/^[a-f0-9]{7,64}$/.test(manifest.releaseDigest ?? '') || !/^[a-f0-9]{40}$/.test(manifest.commit ?? '') || !/^[a-f0-9]{40}$/.test(manifest.tree ?? '') || !/^[a-f0-9]{64}$/.test(manifest.webBuildSha256 ?? '') || !/^[a-f0-9]{64}$/.test(manifest.staticAssetsSha256 ?? '') || !manifest.receipts || JSON.stringify(Object.keys(manifest.receipts).sort()) !== JSON.stringify(requiredReceipts.sort()) || requiredReceipts.some(key => !/^[a-f0-9]{64}$/.test(manifest.receipts[key] ?? ''))) throw new Error('manifest_state_invalid');
            const issued=Date.parse(manifest.issuedAt), expires=Date.parse(manifest.expiresAt), now=Date.now();
            if(!Number.isFinite(issued)||!Number.isFinite(expires)||issued>now+30000||expires<=now||expires-issued>14*86400000) throw new Error('manifest_time_invalid');
            const manifestSha256 = sha(canonical(manifest));
            if (manifestSha256 !== expectedManifestSha256) throw new Error('manifest_identity_mismatch');
            if(!root.includes('Meetwise 知面')||!root.includes('href="/login"')||!login.includes('name="email"')||!login.includes('name="password"')||!login.includes('登录 / 注册')) throw new Error('surface_content_invalid');
            const rootReceipt={status:200,bytes:Buffer.byteLength(root),sha256:sha(root)};
            const loginReceipt={status:200,bytes:Buffer.byteLength(login),sha256:sha(login)};
            const blackbox=sha(canonical({root:rootReceipt,login:loginReceipt}));
            if(manifest.receipts?.edge!==rootReceipt.sha256||manifest.receipts?.blackbox!==blackbox) throw new Error('surface_receipt_mismatch');
            const fs = require('node:fs');
            const context={schemaVersion:1,origin,probeNonce:nonce,checkedAt:new Date(now).toISOString(),manifestSha256,rootStatus:200,loginStatus:200,manifestStatus:200,rootUrl:`${origin}/`,loginUrl:`${origin}/login`,manifestUrl:`${origin}/preview-release-manifest.json`,rootSha256:rootReceipt.sha256,blackboxSha256:blackbox};
            const artifactPath = `${process.env.RUNNER_TEMP}/probe-context.json`;
            const fd = fs.openSync(artifactPath, 'wx', 0o600);
            try { fs.writeFileSync(fd, `${JSON.stringify(context)}\n`); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`context_path=${artifactPath}\n`);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Real browser B/C login and read-only E2E
        id: e2e
        shell: bash
        env:
          REQUESTED_ORIGIN: ${{ inputs.origin }}
          PROBE_NONCE: ${{ inputs.probe_nonce }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          PROBE_CONTEXT_PATH: ${{ steps.probe.outputs.context_path }}
          PROBE_SIGNING_KEY: ${{ secrets.PROBE_SIGNING_KEY }}
          PREVIEW_C_EMAIL: ${{ secrets.PREVIEW_C_EMAIL }}
          PREVIEW_C_PASSWORD: ${{ secrets.PREVIEW_C_PASSWORD }}
          PREVIEW_B_EMAIL: ${{ secrets.PREVIEW_B_EMAIL }}
          PREVIEW_B_PASSWORD: ${{ secrets.PREVIEW_B_PASSWORD }}
        run: node scripts/verify-preview-e2e.mjs

      - name: Upload the exact signed receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meetwise-public-origin-receipt-${{ inputs.probe_nonce }}
          path: ${{ steps.e2e.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 1
